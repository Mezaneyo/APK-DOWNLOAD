<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .search-box { width: 90%; max-width: 500px; padding: 14px 24px; font-size: 16px; border: none; border-radius: 50px; outline: none; margin-top: 20px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .app-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .app-info { flex: 1; }
        .app-name { font-size: 1.4rem; font-weight: bold; color: #333; }
        .app-meta { color: #666; font-size: 0.85rem; margin: 5px 0; }
        .rating { color: #ffc107; margin: 5px 0; }
        .btn { padding: 10px 24px; border-radius: 8px; text-decoration: none; background: #2196F3; color: white; font-weight: bold; }
        .no-results { text-align: center; padding: 50px; color: #999; }
        footer { text-align: center; padding: 20px; color: #999; }
        @media (max-width: 600px) { .app-card { flex-direction: column; text-align: center; } .btn { margin-top: 15px; display: inline-block; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>📱 APK Store</h1>
        <p>Download trusted Android apps</p>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search apps...">
    </div>
    <div class="container" id="appsContainer">Loading...</div>
    <footer><a href="admin.html" style="color:#999;">Admin Panel</a> | <a href="https://github.com/Mezaneyo/APK-DOWNLOAD" style="color:#999;">GitHub</a></footer>

    <script>
        let allApps = [];
        async function loadApps() {
            try {
                const res = await fetch('apps.json?t='+Date.now());
                const data = await res.json();
                allApps = data.apps || [];
                renderApps(allApps);
            } catch(e) { document.getElementById('appsContainer').innerHTML = '<div class="no-results">Error loading apps</div>'; }
        }
        function renderApps(apps) {
            const container = document.getElementById('appsContainer');
            if(!apps.length) { container.innerHTML = '<div class="no-results">No apps found</div>'; return; }
            container.innerHTML = apps.map(app => `
                <div class="app-card">
                    <div class="app-info">
                        <div class="app-name">${app.name}</div>
                        <div class="app-meta">Version ${app.version} | ${app.size}</div>
                        <div class="rating">⭐ ${app.rating||0} (${app.downloads||0} downloads)</div>
                        <div class="app-desc">${app.description}</div>
                    </div>
                    <a href="app-details.html?id=${app.id}" class="btn">View Details</a>
                </div>
            `).join('');
        }
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderApps(allApps.filter(a => a.name.toLowerCase().includes(term) || (a.description||'').toLowerCase().includes(term)));
        });
        loadApps();
    </script>
</body>
</html>
